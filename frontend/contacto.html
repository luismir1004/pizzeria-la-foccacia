<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Contáctanos - Pizzería La Foccacia. Haz tu pedido, reserva una mesa o déjanos tus comentarios." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#C4562A" />
    <title>Contacto | Pizzería La Foccacia</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Preconnect + fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" />

    <!-- CSS & JS -->
    <link rel="stylesheet" href="./src/index.css" />
    <script defer type="module" src="/src/main.js"></script>
</head>

<body class="bg-background transition-colors duration-300 flex flex-col min-h-screen">


    <header class="relative pt-6 pb-6 text-white bg-primary shadow-lg sticky top-0 z-30">
        <div class="w-11/12 mx-auto max-w-7xl">
            <app-navbar></app-navbar>
        </div>
    </header>

    <main class="flex-grow">
        <!-- Hero Section Small -->
        <section
            class="py-20 bg-hero bg-cover bg-center relative before:content-[''] before:bg-black/60 before:absolute before:inset-0">
            <div class="relative z-10 text-center text-white w-11/12 max-w-4xl mx-auto" data-animate="fade-in">
                <h1 class="font-title text-6xl mb-4">Contáctanos</h1>
                <p class="text-xl">Estamos aquí para atenderte</p>
            </div>
        </section>

        <section class="py-20 w-11/12 max-w-7xl mx-auto">
            <div class="grid md:grid-cols-2 gap-12">
                <!-- Información de contacto -->
                <div class="space-y-8" data-animate="slide-up">
                    <div>
                        <h2 class="font-title text-4xl text-primary font-bold mb-6">Información</h2>
                        <p class="text-lg mb-6 dark:text-gray-300">¿Tienes alguna pregunta o sugerencia? Envíanos un
                            mensaje o visítanos.</p>

                        <div class="space-y-6">
                            <div class="flex items-start gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                        </path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg dark:text-gray-200">Teléfono</h3>
                                    <p class="dark:text-gray-400"><a href="tel:+19045550142" class="hover:underline">+1 (904) 555-0142</a></p>
                                </div>
                            </div>

                            <div class="flex items-start gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg dark:text-gray-200">Email</h3>
                                    <p class="dark:text-gray-400">contacto@lafoccacia.com</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg dark:text-gray-200">Horarios</h3>
                                    <p class="dark:text-gray-400">Lunes a Domingo: 11:00 AM - 11:00 PM</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario -->
                <div class="bg-white dark:bg-surface p-8 rounded-2xl shadow-card hover:shadow-card-hover transition-shadow duration-300"
                    data-animate="scale-in" data-delay="200">
                    <h2 class="font-title text-3xl font-bold text-primary mb-6">Envíanos un mensaje</h2>
                    <form class="space-y-6">
                        <div class="space-y-2">
                            <label for="nombre" class="block text-sm font-medium dark:text-gray-300">Nombre
                                completo</label>
                            <input type="text" id="nombre"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition dark:bg-gray-800 dark:text-white"
                                placeholder="Tu nombre">
                        </div>

                        <div class="space-y-2">
                            <label for="email" class="block text-sm font-medium dark:text-gray-300">Correo
                                electrónico</label>
                            <input type="email" id="email"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition dark:bg-gray-800 dark:text-white"
                                placeholder="tu@email.com">
                        </div>

                        <div class="space-y-2">
                            <label for="mensaje" class="block text-sm font-medium dark:text-gray-300">Mensaje</label>
                            <textarea id="mensaje" rows="4"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition dark:bg-gray-800 dark:text-white"
                                placeholder="¿En qué podemos ayudarte?"></textarea>
                        </div>

                        <button type="submit"
                            class="btn-premium w-full shadow-lg hover:shadow-xl transform transition hover:-translate-y-1">
                            Enviar Mensaje
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-auto">
        <app-footer></app-footer>
    </footer>
</body>

</html>
