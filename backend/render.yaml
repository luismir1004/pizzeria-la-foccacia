# Blueprint de despliegue para Render (https://render.com)
# Crea la base de datos y el servicio web. Tras el primer deploy, ejecuta
# una vez en la shell del servicio:  npm run migrate && npm run seed
services:
  - type: web
    name: foccacia-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foccacia-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: foccacia-db
    plan: free
    databaseName: pizzeria
    user: admin
